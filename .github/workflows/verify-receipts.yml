name: Verify On-Chain Tape

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: web-cockpit/typescript
        run: npm ci || npm install

      - name: Run Invariant & Unit Tests
        working-directory: web-cockpit/typescript
        run: npm test

      - name: Run Receipt Verification Tape
        working-directory: web-cockpit/typescript
        run: node src/verify-receipts.mjs

