<!doctype html>
<html lang="en" class="light scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChronoShield // Autonomous Liquidation Hedging Protocol (Somnia Shannon)</title>
    <meta name="description" content="Autonomous on-chain liquidation hedging protocol built on Somnia Shannon Testnet. Real-time health factor monitoring, binary DOWN hedge execution on DreamDEX, and zero bad debt guarantee." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('chronoshield-theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
